# Normalization rules for SUME Dashboard
#
# The normalizer preserves faculty information from SUME's format:
# - "Despacho General (Mesa de Entradas - FBCB)" → "Despacho General (FBCB)"
# - "Mesa de Entradas - FBCB" → "Mesa de Entradas - FBCB" (preserved)
# - "CETRI (Mesa de Entradas - Rectorado)" → "CETRI (Rectorado)"
#
# Rules are applied in order. First match wins.
# The explicit_overrides table is checked FIRST (highest precedence).
#
# Rule types:
# - preserve_mde: Preserves exact MDE dependency names
# - identity: Returns input unchanged (fallback)

rules:
  - type: "preserve_mde"
    description: "Preserve exact MDE names"
    patterns:
      - "^Mesa de Entradas$"
      - "^MDE$"
      - "^M\\.D\\.E\\.$"

  - type: "identity"
    description: "Fallback: return input unchanged"

# Explicit override mappings (highest precedence)
# Format: original_name -> normalized_name
# These are checked BEFORE any rule is applied.
explicit_overrides:
  # Abbreviations without faculty
  "MDE": "Mesa de Entradas"
  "M.D.E.": "Mesa de Entradas"

# Metadata
metadata:
  version: "2.0"
  description: "Normalization rules for SUME Dashboard - preserves faculty information"
  last_updated: "2026-09-09"
  maintained_by: "Mesa de Entradas FBCB-UNL"
